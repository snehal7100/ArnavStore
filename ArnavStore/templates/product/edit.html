{% include "Component/header.html" %}
{% include "Component/sidebar.html" %}

<!DOCTYPE html>
<html lang="en">
<head>
    <title>Edit Product</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        .card-header {
            margin-top: 60px;
            font-weight: bold;
            font-size: 17px;
        }
        .content-wrapper {
            margin-top: 33px;
        }
    </style>
</head>

<body>
<div class="content-wrapper">
    <div class="container mt-3">
        <div class="card">

            <!-- Header -->
            <div class="card-header">
                Edit Product
            </div>

            <!-- Body -->
            <div class="card-body">
                <form action="" method="post" enctype="multipart/form-data">
                    {% csrf_token %}

                    <!-- Row 1 -->
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="pname">Product Name:</label>
                            <input type="text" class="form-control" value="{{ pData.pname }}" id="pname" name="pname" placeholder="Enter product name">
                        </div>

                        <div class="col-md-6">
                            <label for="hsncode">HSN Code:</label>
                            <input type="text" class="form-control" value="{{ pData.hsncode }}" id="hsncode" name="hsncode" placeholder="Enter HSN code">
                        </div>
                    </div>

                    <!-- Row 2 -->
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="tax">Tax:</label>
                            <input type="text" class="form-control" value="{{ pData.tax }}" id="tax" name="tax" placeholder="Enter tax">
                        </div>

                        <div class="col-md-6">
                            <label for="qty">Quantity (QTY):</label>
                            <input type="text" class="form-control" value="{{ pData.qty }}" id="qty" name="qty" placeholder="Enter quantity">
                        </div>
                    </div>

                    <!-- Row 3 -->
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="unit">Unit:</label>
                            <input type="text" class="form-control" value="{{ pData.unit }}" id="unit" name="unit" placeholder="Enter unit (e.g. PCS)">
                        </div>

                        <div class="col-md-6">
                            <label for="rate">Rate:</label>
                            <input type="text" class="form-control" value="{{ pData.rate }}" id="rate" name="rate" placeholder="Enter rate">
                        </div>
                    </div>

                    <!-- Row 4 -->
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="amt">Amount:</label>
                            <input type="text" class="form-control" value="{{ pData.amt }}" id="amt" name="amt" placeholder="Amount">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">Update Product</button>
                </form>
            </div>

        </div>
    </div>
</div>
</body>
</html>

{% include "Component/footer.html" %}
